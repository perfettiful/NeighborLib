<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<title>Default cursor, a bookmark</title>

<!-- the plain arrow. it is a bookmark, swallowtail notch and all, tipped
     over far enough that its point lands where an arrow point belongs.
     hotspot 3 2, which is the tip.

     pale fill with a dark outline, not the other way round. the first
     version was solid ink and it sank into the dark curator nav, leaving
     only its white halo behind. a pale body reads on both backgrounds,
     which is why every system cursor since about 1984 is built this way. -->

<g transform="translate(3,2) rotate(-20)">
	<path d="M0,0 L3.5,7 L3.5,26 L0,20 L-3.5,26 L-3.5,7 Z"
		fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
	<path d="M0,0 L3.5,7 L3.5,26 L0,20 L-3.5,26 L-3.5,7 Z"
		fill="#fffdf7" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round" />
	<path d="M-3.5,11.5 L3.5,11.5" stroke="#d6336c" stroke-width="2.8" />
</g>
</svg>
