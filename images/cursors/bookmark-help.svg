<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<title>Help cursor, a bookmark with a question badge</title>

<!-- the numbered dots. they explain something rather than take you
     anywhere, so they get help and not pointer. the same bookmark as the
     default cursor, shrunk to make room for a badge hung off it, which is
     how every help cursor has worked since about 1995. hotspot 3 2. -->

<g transform="translate(3,2) rotate(-20) scale(.7)">
	<path d="M0,0 L3.5,7 L3.5,26 L0,20 L-3.5,26 L-3.5,7 Z"
		fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round" />
	<path d="M0,0 L3.5,7 L3.5,26 L0,20 L-3.5,26 L-3.5,7 Z"
		fill="#fffdf7" stroke="#2b2b2b" stroke-width="2.6" stroke-linejoin="round" />
</g>

<circle cx="22" cy="21.5" r="9" fill="#ffffff" />
<circle cx="22" cy="21.5" r="7.2" fill="#d6336c" stroke="#2b2b2b" stroke-width="1.4" />

<path d="M19.3,19.5 a2.8,2.8 0 1 1 3.5,2.9 c-0.8,0.3 -0.9,0.8 -0.9,1.4"
	fill="none" stroke="#ffffff" stroke-width="2"
	stroke-linecap="round" stroke-linejoin="round" />
<circle cx="21.9" cy="25.6" r="1.25" fill="#ffffff" />
</svg>
