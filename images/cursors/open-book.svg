<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<title>Pointer cursor, an open book with a page caught mid turn</title>

<!-- anything you can click.
     the first version was a symmetric open book and it had no point, so
     nothing told you where the click was going to land. a pointer needs
     one obviously sharp corner and that corner has to sit on the hotspot.
     so a page is caught halfway through turning, and its lifted corner is
     that point. hotspot 4 3.
     it also gets the page flip across without moving, which matters
     because cursors cannot animate. -->

<g fill="none" stroke="#ffffff" stroke-width="4.5"
	stroke-linejoin="round" stroke-linecap="round">
	<path d="M5,16 C9,14 13,14 16.2,16.2 L16.2,27 C13,24.8 9,24.8 5,27 Z" />
	<path d="M29,16 C25.5,14 21.5,14 17.8,16.2 L17.8,27 C21.5,24.8 25.5,24.8 29,27 Z" />
	<path d="M4,3 C10.5,5 15.5,9.5 17.5,15.8 C11.5,14.5 6.5,10 4,3 Z" />
</g>

<g fill="#fffdf7" stroke="#2b2b2b" stroke-width="2"
	stroke-linejoin="round" stroke-linecap="round">
	<path d="M5,16 C9,14 13,14 16.2,16.2 L16.2,27 C13,24.8 9,24.8 5,27 Z" />
	<path d="M29,16 C25.5,14 21.5,14 17.8,16.2 L17.8,27 C21.5,24.8 25.5,24.8 29,27 Z" />
</g>

<!-- two lines of type on the page that is still lying flat -->
<g stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round">
	<path d="M20.5,19.5 L26,18.5" /><path d="M20.5,23 L26,22" />
</g>

<!-- the page in the air, drawn last so it sits over the spine -->
<path d="M4,3 C10.5,5 15.5,9.5 17.5,15.8 C11.5,14.5 6.5,10 4,3 Z"
	fill="#ffffff" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round" />
</svg>
