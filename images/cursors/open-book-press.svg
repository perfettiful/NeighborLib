<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<title>Pressed pointer, the page has landed</title>

<!-- shown while the mouse is held down on something clickable, through
     a:active. the pair to open-book, and between them they are the page
     flip: lifted and mid turn, then landed.
     cursors cannot animate, so the two frames are driven by the mouse
     instead of by a timeline, which is better anyway because the motion
     now means something.

     the small sliver still at the tip is doing real work. the hotspot is
     4 3 on both frames, and if the pressed one had nothing there the
     cursor would look like it had jumped off its own point. so the next
     page is already starting to lift. -->

<g fill="none" stroke="#ffffff" stroke-width="4.5"
	stroke-linejoin="round" stroke-linecap="round">
	<path d="M5,16 C9,14 13,14 16.2,16.2 L16.2,27 C13,24.8 9,24.8 5,27 Z" />
	<path d="M29,16 C25.5,14 21.5,14 17.8,16.2 L17.8,27 C21.5,24.8 25.5,24.8 29,27 Z" />
	<path d="M5,13.6 C9,11.6 13,11.6 16.2,13.8 L16.2,16.4 C13,14.2 9,14.2 5,16.2 Z" />
	<path d="M4,3 C6.6,5.6 8.6,8.2 9.6,11.2 C7,10.2 5,6.6 4,3 Z" />
</g>

<g fill="#fffdf7" stroke="#2b2b2b" stroke-width="2"
	stroke-linejoin="round" stroke-linecap="round">
	<path d="M5,16 C9,14 13,14 16.2,16.2 L16.2,27 C13,24.8 9,24.8 5,27 Z" />
	<path d="M29,16 C25.5,14 21.5,14 17.8,16.2 L17.8,27 C21.5,24.8 25.5,24.8 29,27 Z" />
</g>

<g stroke="#adb5bd" stroke-width="1.4" stroke-linecap="round">
	<path d="M20.5,19.5 L26,18.5" /><path d="M20.5,23 L26,22" />
</g>

<!-- the page that just came down, lying on the left side -->
<path d="M5,13.6 C9,11.6 13,11.6 16.2,13.8 L16.2,16.4 C13,14.2 9,14.2 5,16.2 Z"
	fill="#ffffff" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round" />

<!-- and the next one starting to lift, keeping the point on the hotspot -->
<path d="M4,3 C6.6,5.6 8.6,8.2 9.6,11.2 C7,10.2 5,6.6 4,3 Z"
	fill="#ffffff" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round" />
</svg>
