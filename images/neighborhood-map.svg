<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"
	role="img" aria-labelledby="mapTitle mapDesc">

<title id="mapTitle">Map of six little free libraries in the Como neighborhood</title>
<desc id="mapDesc">A street map with six numbered markers. The same six boxes are listed
as text next to this map, with distances and how recently each list was updated.</desc>

<!-- drawn by hand instead of dropping in a google maps screenshot, which i
     can't license for a school project. colors copied off a normal map so it
     reads as one at a glance. a real build would put a mapbox static image
     here, same dimensions. -->

<defs>
	<style>
		.road    { stroke:#fff; stroke-linecap:round; }
		.casing  { stroke:#e2ded5; stroke-linecap:round; }
		.major   { stroke:#fbf0cd; }
		.mcasing { stroke:#e8d9a8; }
		.lbl     { font:italic 11px Georgia,serif; fill:#8a8578; }
		.lbl2    { font:11px Helvetica,Arial,sans-serif; fill:#7d7a72; }
		.pk      { font:italic 12px Georgia,serif; fill:#5f8a3f; }
		.wt      { font:italic 12px Georgia,serif; fill:#6d9cab; }
	</style>
</defs>

<!-- land -->
<rect width="800" height="520" fill="#f3f0e9" />

<!-- the lake, bottom left -->
<path d="M0 420 q70 -40 150 -18 q60 16 92 54 q20 24 14 64 L0 520 Z" fill="#aad3df" />
<text class="wt" x="56" y="482">Como Lake</text>

<!-- park, upper right -->
<path d="M560 40 h200 v150 q-60 26 -112 6 q-48 -18 -88 -58 Z" fill="#cdebb0" />
<text class="pk" x="608" y="112">Como Park</text>

<!-- a few blocks of built-up shapes so it isn't just lines -->
<g fill="#e6e2d8">
	<rect x="200" y="120" width="54" height="36" /><rect x="268" y="120" width="40" height="36" />
	<rect x="200" y="196" width="40" height="30" /><rect x="256" y="196" width="52" height="30" />
	<rect x="350" y="268" width="46" height="34" /><rect x="412" y="268" width="38" height="34" />
	<rect x="196" y="320" width="50" height="40" /><rect x="262" y="330" width="36" height="30" />
	<rect x="480" y="330" width="60" height="38" /><rect x="556" y="340" width="42" height="28" />
	<rect x="330" y="80" width="44" height="28" /><rect x="640" y="300" width="56" height="44" />
	<rect x="90" y="200" width="46" height="34" /><rect x="92" y="268" width="38" height="30" />
</g>

<!--  roads. casing underneath, white on top  -->

<!-- east west -->
<g class="casing" fill="none" stroke-width="15">
	<line x1="0" y1="96" x2="800" y2="96" /><line x1="0" y1="172" x2="800" y2="172" />
	<line x1="0" y1="246" x2="800" y2="246" /><line x1="0" y1="312" x2="800" y2="312" />
	<line x1="0" y1="384" x2="800" y2="384" />
</g>
<g class="road" fill="none" stroke-width="11">
	<line x1="0" y1="96" x2="800" y2="96" /><line x1="0" y1="172" x2="800" y2="172" />
	<line x1="0" y1="246" x2="800" y2="246" /><line x1="0" y1="312" x2="800" y2="312" />
	<line x1="0" y1="384" x2="800" y2="384" />
</g>

<!-- north south -->
<g class="casing" fill="none" stroke-width="15">
	<line x1="168" y1="0" x2="168" y2="520" /><line x1="318" y1="0" x2="318" y2="520" />
	<line x1="462" y1="0" x2="462" y2="520" /><line x1="608" y1="0" x2="608" y2="520" />
</g>
<g class="road" fill="none" stroke-width="11">
	<line x1="168" y1="0" x2="168" y2="520" /><line x1="318" y1="0" x2="318" y2="520" />
	<line x1="462" y1="0" x2="462" y2="520" /><line x1="608" y1="0" x2="608" y2="520" />
</g>

<!-- the one big diagonal, so the grid doesn't look fake -->
<line class="mcasing" x1="-20" y1="40" x2="820" y2="470" stroke-width="22" fill="none" />
<line class="major"   x1="-20" y1="40" x2="820" y2="470" stroke-width="17" fill="none" />

<!-- street names, set along the roads like a real map does -->
<text class="lbl" x="36"  y="92">W Como Blvd</text>
<text class="lbl" x="36"  y="168">Hoyt Ave W</text>
<text class="lbl" x="500" y="168">Hoyt Ave W</text>
<text class="lbl" x="36"  y="242">Van Buren Ave</text>
<text class="lbl" x="520" y="242">Van Buren Ave</text>
<text class="lbl" x="36"  y="308">Front Ave</text>
<text class="lbl" x="620" y="380">Thomas Ave</text>
<text class="lbl" x="172" y="470" transform="rotate(-90 172 470)">Snelling Ave</text>
<text class="lbl" x="322" y="470" transform="rotate(-90 322 470)">Hamline Ave</text>
<text class="lbl" x="466" y="130" transform="rotate(-90 466 130)">Griggs St</text>
<text class="lbl" x="612" y="490" transform="rotate(-90 612 490)">Lexington Pkwy</text>
<text class="lbl2" x="360" y="214" transform="rotate(27 360 214)">Como Ave</text>

<!--  the six boxes  -->
<!-- green = list looks current, gray = stale or nearly empty. the count is
     inside the marker so the map answers something without being clicked. -->

<g font="bold 13px Helvetica,Arial,sans-serif" text-anchor="middle">

	<!-- Como Ave box, 34 -->
	<g>
		<path d="M242 150 l-9 15 l18 0 Z" fill="#2f9e44" />
		<circle cx="242" cy="134" r="18" fill="#2f9e44" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="242" y="139" fill="#fff">34</text>
	</g>

	<!-- Hoyt and Snelling, 51 -->
	<g>
		<path d="M398 262 l-9 15 l18 0 Z" fill="#2f9e44" />
		<circle cx="398" cy="246" r="18" fill="#2f9e44" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="398" y="251" fill="#fff">51</text>
	</g>

	<!-- Little Bear, 12, stale -->
	<g>
		<path d="M212 300 l-9 15 l18 0 Z" fill="#868e96" />
		<circle cx="212" cy="284" r="18" fill="#868e96" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="212" y="289" fill="#fff">12</text>
	</g>

	<!-- Hamline and Van Buren, 27 -->
	<g>
		<path d="M540 342 l-9 15 l18 0 Z" fill="#2f9e44" />
		<circle cx="540" cy="326" r="18" fill="#2f9e44" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="540" y="331" fill="#fff">27</text>
	</g>

	<!-- Griggs St, 4, nearly empty -->
	<g>
		<path d="M672 182 l-9 15 l18 0 Z" fill="#868e96" />
		<circle cx="672" cy="166" r="18" fill="#868e96" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="672" y="171" fill="#fff">4</text>
	</g>

	<!-- Front St bench box, 19 -->
	<g>
		<path d="M330 420 l-9 15 l18 0 Z" fill="#2f9e44" />
		<circle cx="330" cy="404" r="18" fill="#2f9e44" stroke="#2b2b2b" stroke-width="2.5" />
		<text x="330" y="409" fill="#fff">19</text>
	</g>

</g>

<!-- you are here -->
<circle cx="462" cy="384" r="9"  fill="#1c7ed6" fill-opacity=".25" />
<circle cx="462" cy="384" r="5"  fill="#1c7ed6" stroke="#fff" stroke-width="2" />
<text x="476" y="402" font="11px Helvetica,Arial,sans-serif" fill="#1c7ed6">55113</text>

<!-- scale bar, because every map has one -->
<g stroke="#5a5a5a" stroke-width="2" fill="none">
	<path d="M644 492 v8 h88 v-8" />
</g>
<text x="688" y="488" font="10px Helvetica,Arial,sans-serif" fill="#5a5a5a" text-anchor="middle">1/4 mile</text>

</svg>
